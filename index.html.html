<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЕГЭ История — Тренажёр</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0e6; --card: #fff; --ink: #232323; --muted: #6b6b6b;
    --blue: #1a3a5c; --gold: #c9a961;
    --green-bg: #d7f0d8; --green-br: #2e7d32;
    --red-bg: #f8d7da; --red-br: #c62828;
    --line: #e3ddce;
  }
  html, body { min-height: 100%; }
  body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  #app { max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; transition: max-width .25s; }
  body.ref-open #app { max-width: 1280px; }

  .brand { text-align: center; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 2px solid var(--gold); }
  .brand h1 { font-size: 30px; letter-spacing: 1px; color: var(--blue); font-weight: 700; }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 6px; font-style: italic; }

  .home-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 640px) { .home-cards { grid-template-columns: 1fr; } }
  .home-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 18px; text-align: center; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .home-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 20px rgba(26,58,92,.10); }
  .home-card .icon { font-size: 40px; margin-bottom: 10px; }
  .home-card h3 { color: var(--blue); font-size: 20px; margin-bottom: 6px; }
  .home-card p { color: var(--muted); font-size: 13px; }

  .back-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .arrow-btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: 42px; height: 42px; font-size: 20px; cursor: pointer; color: var(--blue); display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
  .arrow-btn:hover:not(:disabled) { background: #f0e9da; border-color: var(--gold); }
  .arrow-btn:disabled { opacity: .35; cursor: not-allowed; }

  .section-title { font-size: 22px; color: var(--blue); margin-bottom: 4px; }
  .section-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .period-list { display: flex; flex-direction: column; gap: 10px; }
  .period-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color .15s, transform .15s; font-size: 15px; }
  .period-item:hover { border-color: var(--gold); transform: translateX(3px); }
  .period-item.disabled { opacity: .5; cursor: default; }
  .period-item.disabled:hover { border-color: var(--line); transform: none; }
  .period-item .count { color: var(--muted); font-size: 13px; font-family: sans-serif; }
  .soon-badge { background: #f0e9da; color: #8a7a55; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-family: sans-serif; }

  .level-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
  .level-cards.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 760px) { .level-cards, .level-cards.three { grid-template-columns: 1fr; } }
  .level-card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 28px 20px; cursor: pointer; text-align: center; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .level-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 20px rgba(26,58,92,.10); }
  .level-card .icon { font-size: 46px; margin-bottom: 10px; }
  .level-card h3 { color: var(--blue); font-size: 19px; margin-bottom: 8px; }
  .level-card p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .level-card .tag { display: inline-block; margin-top: 12px; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-family: sans-serif; }
  .level-card.easy .tag { background: #d7f0d8; color: #2e7d32; }
  .level-card.hard .tag { background: #f8d7da; color: #c62828; }
  .level-card.ref .tag { background: #f0e9da; color: #8a7a55; }

  .quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .progress-text { color: var(--muted); font-size: 13px; font-family: sans-serif; }
  .mini-btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--blue); font-family: sans-serif; transition: background .15s, border-color .15s; }
  .mini-btn:hover { background: #f0e9da; border-color: var(--gold); }
  .mini-btn.primary { background: var(--gold); color: #fff; border-color: var(--gold); }
  .mini-btn.primary:hover { background: #b3924d; }
  .progress-bar { height: 6px; background: #e8e1d0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--gold); width: 0%; transition: width .3s; }

  .question-box { background: var(--card); border: 2px solid var(--blue); border-radius: 14px; padding: 22px 20px; margin-bottom: 18px; text-align: center; }
  .question-box .q-label { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-family: sans-serif; }
  .question-box .q-text { font-size: 28px; color: var(--blue); font-weight: 700; }
  .question-box .q-text-sm { font-size: 20px; color: var(--blue); font-weight: 700; }
  .question-box .q-desc { color: var(--muted); font-size: 14px; margin-top: 8px; font-style: italic; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; transition: border-color .15s, background .15s, transform .1s; font-family: inherit; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 14px; width: 100%; }
  .option:hover:not(.locked) { border-color: var(--gold); transform: translateX(3px); }
  .option .num { background: #f0e9da; color: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: sans-serif; flex-shrink: 0; font-size: 14px; }
  .option .opt-body { flex: 1; }
  .option .opt-title { font-weight: 700; color: var(--blue); }
  .option .opt-meta { color: var(--muted); font-size: 13px; font-family: sans-serif; margin-top: 2px; }
  .option.correct { background: var(--green-bg); border-color: var(--green-br); }
  .option.correct .num { background: var(--green-br); color: #fff; }
  .option.wrong { background: var(--red-bg); border-color: var(--red-br); }
  .option.wrong .num { background: var(--red-br); color: #fff; }
  .option.locked { cursor: default; }

  .typing-area { display: flex; gap: 10px; margin-top: 4px; }
  .date-input { flex: 1; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--ink); background: var(--card); transition: border-color .15s; }
  .date-input:focus { outline: none; border-color: var(--gold); }
  .date-input:disabled { background: #f5f0e6; color: var(--muted); }
  .feedback { margin-top: 14px; padding: 14px 18px; border-radius: 12px; font-size: 15px; border: 2px solid; }
  .feedback.fb-correct { background: var(--green-bg); border-color: var(--green-br); color: #1b5e20; }
  .feedback.fb-wrong { background: var(--red-bg); border-color: var(--red-br); color: #b71c1c; }

  .ege-table { background: var(--card); border: 2px solid var(--blue); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .ege-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .ege-row:last-child { border-bottom: none; }
  .ege-letter { background: #f0e9da; color: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: sans-serif; flex-shrink: 0; font-size: 14px; }
  .ege-prompt { flex: 1; font-size: 15px; color: var(--ink); min-width: 160px; }
  .ege-nums { display: flex; gap: 6px; flex-shrink: 0; }
  .ege-num-btn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--line); background: #fff; color: var(--blue); font-family: sans-serif; font-weight: 700; cursor: pointer; font-size: 13px; transition: all .12s; }
  .ege-num-btn:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .ege-num-btn.selected { background: var(--gold); color: #fff; border-color: var(--gold); }
  .ege-num-btn.correct { background: var(--green-br); color: #fff; border-color: var(--green-br); }
  .ege-num-btn.wrong { background: var(--red-br); color: #fff; border-color: var(--red-br); }
  .ege-num-btn:disabled { cursor: default; }

  .ege-options-box { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .ege-options-box .opt-row { display: flex; gap: 12px; padding: 8px 0; align-items: flex-start; border-bottom: 1px dashed var(--line); }
  .ege-options-box .opt-row:last-child { border-bottom: none; }
  .ege-options-box .num-badge { background: #f0e9da; color: var(--blue); min-width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: sans-serif; font-size: 13px; flex-shrink: 0; }
  .ege-options-box .opt-text { font-size: 14px; color: var(--ink); }

  .result { background: var(--card); border: 2px solid var(--gold); border-radius: 16px; padding: 34px 24px; text-align: center; }
  .result .score { font-size: 54px; color: var(--blue); font-weight: 700; margin: 10px 0; }
  .result .score span { font-size: 26px; color: var(--muted); }
  .result .verdict { font-size: 18px; color: var(--ink); margin: 16px auto 6px; max-width: 540px; }
  .result .emoji { font-size: 56px; margin-bottom: 8px; }
  .result-actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 12px 22px; cursor: pointer; font-size: 15px; font-family: inherit; transition: background .15s, transform .1s; }
  .btn-primary:hover { background: #244b74; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); border-radius: 10px; padding: 12px 22px; cursor: pointer; font-size: 15px; font-family: inherit; transition: background .15s, border-color .15s; }
  .btn-ghost:hover { background: #f0e9da; border-color: var(--gold); }

  .fade-in { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .ref-layout { display: grid; grid-template-columns: 1fr; gap: 18px; transition: grid-template-columns .3s ease; }
  .ref-layout.open { grid-template-columns: minmax(0, 1fr) 420px; }
  .ref-side { display: none; max-height: 82vh; overflow-y: auto; background: var(--card); border: 2px solid var(--gold); border-radius: 14px; padding: 14px 16px; }
  .ref-layout.open .ref-side { display: block; }
  @media (max-width: 980px) {
    .ref-layout.open { grid-template-columns: 1fr; }
    .ref-layout.open .ref-side { max-height: 500px; }
  }
  .ref-title { font-size: 18px; color: var(--blue); margin-bottom: 4px; font-weight: 700; }
  .ref-sub { font-size: 12px; color: var(--muted); font-family: sans-serif; margin-bottom: 12px; }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ref-table th, .ref-table td { text-align: left; padding: 6px 8px; border-bottom: 1px dashed var(--line); vertical-align: top; }
  .ref-table th { color: var(--gold); font-family: sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; background: var(--card); }
  .ref-table td.name { color: var(--blue); font-weight: 700; }
  .ref-table td.meta { color: var(--muted); font-size: 12px; font-family: sans-serif; white-space: nowrap; }
  .ref-table td.ref-period { background: #f0e9da; color: #1a3a5c; font-weight: 700; font-family: sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .ref-table tr:hover td:not(.ref-period) { background: #faf5e8; }

  .ref-full-wrap { background: var(--card); border: 2px solid var(--gold); border-radius: 14px; padding: 18px 20px; max-height: none; }
  .ref-search { width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 15px; background: var(--card); margin-bottom: 14px; }
  .ref-search:focus { outline: none; border-color: var(--gold); }

  .peeked-badge { background: #f0e9da; color: #8a7a55; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-family: sans-serif; }
</style>
</head>

function isGenericAuthor(a) {
  if (!a) return true;
  const s = a.toLowerCase();
  return s === 'русские мастера' || s === 'псковские мастера' || s === 'неизвестен' || s === '—';
}
function getCreatorFact(m) {
  if (m.ruler) return { text: `Создан при ${m.ruler}`, kind:'ruler' };
  if (m.author && !isGenericAuthor(m.author)) return { text: `Автор — ${m.author}`, kind:'author' };
  return null;
}
function getCityFact(m) { return `Находится в ${m.city}`; }
function getYearFact(m) { return `Создан в ${m.year}`; }
function getDescFact(m) { return m.desc; }

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

const ROMAN_MAP = {
  'xx':'20','xix':'19','xviii':'18','xvii':'17','xvi':'16','xv':'15','xiv':'14',
  'xiii':'13','xii':'12','xi':'11','x':'10','ix':'9','viii':'8','vii':'7',
  'vi':'6','v':'5','iv':'4','iii':'3','ii':'2','i':'1'
};
function romanToArabic(s) {
  let out = s.toLowerCase();
  Object.keys(ROMAN_MAP).sort((a,b) => b.length - a.length).forEach(k => {
    out = out.replace(new RegExp('\\b' + k + '\\b', 'g'), ROMAN_MAP[k]);
  });
  return out;
}
function normalizeDate(s) {
  let x = String(s).toLowerCase();
  x = romanToArabic(x);
  x = x.replace(/\s+/g, '');
  x = x.replace(/[–—−]/g, '-');
  x = x.replace(/[.,;:]/g, '');
  x = x.replace(/гг?\.?/g, '');
  x = x.replace(/вв?\.?/g, '');
  x = x.replace(/е$/, '');
  x = x.replace(/начало|конец|нач|кон/g, '');
  return x.trim();
}
function datesMatch(input, correct) {
  return normalizeDate(input) === normalizeDate(correct);
}
function isTypeable(date) { return /^\d/.test(date); }

function normalizeAnswer(s) {
  let x = String(s).toLowerCase().trim();
  x = x.replace(/ё/g, 'е');
  x = romanToArabic(x);
  x = x.replace(/[^а-яa-z0-9]/g, '');
  return x;
}
function creatorMatch(userInput, correctName) {
  const u = normalizeAnswer(userInput);
  const c = normalizeAnswer(correctName);
  if (!u || !c) return false;
  if (u === c) return true;
  if (u.length >= 4 && c.includes(u)) return true;
  if (c.length >= 4 && u.includes(c)) return true;
  const words = String(correctName).split(/\s+/).map(normalizeAnswer).filter(w => w.length >= 4);
  for (const w of words) {
    if (u.includes(w)) return true;
  }
  return false;
}
function yearMatch(userInput, correctYear) {
  return normalizeAnswer(userInput) === normalizeAnswer(correctYear);
}

   9. ГЕНЕРАТОРЫ
   ========================================================= */
function buildDateQuiz(source, period, reverse, level) {
  const data = source === 'world' ? WORLD_DATES : RUSSIAN_DATES;
  let pool = period === 'all' ? data : data.filter(d => d.period === period);
  if (level === 'hard') pool = pool.filter(d => isTypeable(d.date));
  if (pool.length < 1) pool = data.filter(d => level === 'hard' ? isTypeable(d.date) : true);

  if (level === 'hard') {
    return shuffle([...pool]).map(item => ({ item, options: [], correctIndex: 0, reverse: false }));
  }
  return shuffle([...pool]).map(item => {
    const same = data.filter(d => d.period === item.period && d !== item && d.event !== item.event);
    let distractors = shuffle(same).slice(0, 2);
    if (distractors.length < 2) {
      const others = shuffle(data.filter(d => d.period !== item.period && d.event !== item.event));
      distractors = distractors.concat(others.slice(0, 2 - distractors.length));
    }
    const options = shuffle([item, ...distractors]);
    return { item, options, correctIndex: options.indexOf(item), reverse };
  });
}

function buildArtasovQuiz() {
  const pool = shuffle([...CULTURE_DATA]);
  return pool.map(m => {
    const available = [];
    if (getCreatorFact(m)) available.push('creator');
    available.push('year', 'city', 'desc');
    const type = available[Math.floor(Math.random() * available.length)];

    let correctText = '';
    switch (type) {
      case 'creator': correctText = getCreatorFact(m).text; break;
      case 'year':    correctText = getYearFact(m); break;
      case 'city':    correctText = getCityFact(m); break;
      case 'desc':    correctText = getDescFact(m); break;
    }

    const others = shuffle(CULTURE_DATA.filter(x => x.name !== m.name));
    const distractors = [];
    for (const o of others) {
      let f = '';
      switch (type) {
        case 'creator': { const c = getCreatorFact(o); if (!c) continue; f = c.text; break; }
        case 'year':    f = getYearFact(o); break;
        case 'city':    f = getCityFact(o); break;
        case 'desc':    f = getDescFact(o); break;
      }
      if (f && f !== correctText && !distractors.some(d => d.text === f)) {
        distractors.push({ text: f, monument: o });
      }
      if (distractors.length >= 2) break;
    }
    while (distractors.length < 2) {
      const o = others[distractors.length];
      let f = '';
      switch (type) {
        case 'creator': { const c = getCreatorFact(o); f = c ? c.text : ''; break; }
        case 'year':    f = getYearFact(o); break;
        case 'city':    f = getCityFact(o); break;
        case 'desc':    f = getDescFact(o); break;
      }
      if (f) distractors.push({ text: f, monument: o });
    }

    const correctOpt = { text: correctText, monument: m };
    const options = shuffle([correctOpt, ...distractors]);
    return { monument: m, type, fact: correctText, options, correctIndex: options.indexOf(correctOpt) };
  });
}

function buildOlimpiadnikQuiz() {
  const questions = [];
  for (const m of CULTURE_DATA) {
    const c = getCreatorFact(m);
    if (c) {
      const isRuler = c.kind === 'ruler';
      const answer = isRuler ? m.ruler : m.author;
      if (answer && !isGenericAuthor(answer)) {
        questions.push({
          monument: m,
          kind: isRuler ? 'ruler' : 'author',
          question: isRuler
            ? `При ком был создан/построен «${m.name}»?`
            : `Кто автор «${m.name}»?`,
          expected: answer,
          checkFn: (v) => creatorMatch(v, answer)
        });
      }
    }
    questions.push({
      monument: m,
      kind: 'year',
      question: `В каком году был(о) создан(о)/построен(о) «${m.name}»?`,
      expected: m.year,
      checkFn: (v) => yearMatch(v, m.year)
    });
  }
  return shuffle(questions);
}

function buildCharacterCardsQuiz(reverse) {
  const all = CHARACTERS;
  const pool = shuffle([...all]);
  return pool.map(item => {
    const same = all.filter(c => c.period === item.period && c.name !== item.name && c.action !== item.action);
    let distractors = shuffle(same).slice(0, 2);
    if (distractors.length < 2) {
      const others = shuffle(all.filter(c => c.period !== item.period && c.action !== item.action));
      distractors = distractors.concat(others.slice(0, 2 - distractors.length));
    }
    const options = shuffle([item, ...distractors]);
    return { item, options, correctIndex: options.indexOf(item), reverse };
  });
}
function buildOneCharacterEgeRound(pool, reverse) {
  if (pool.length < 6) pool = CHARACTERS;
  const picked = shuffle([...pool]).slice(0, 6);
  const correct = picked.slice(0, 4);
  const decoys  = picked.slice(4, 6);
  const allActivities = shuffle([...correct.map(c => c.action), ...decoys.map(c => c.action)]);
  const correctForPerson = correct.map(c => allActivities.indexOf(c.action) + 1);
  const reverseActivities = shuffle(correct.map(c => c.action));
  const reversePersons = shuffle([...correct, ...decoys]);
  const correctForActivity = reverseActivities.map(a => {
    const person = correct.find(c => c.action === a);
    return reversePersons.indexOf(person) + 1;
  });
  return { correct, decoys, activities: allActivities, correctForPerson, reverseActivities, reversePersons, correctForActivity };
}
function buildCharacterEgeQuiz(period) {
  const roundCount = 3;
  let pool;
  if (period === 'all') pool = CHARACTERS;
  else {
    pool = CHARACTERS.filter(c => c.period === period);
    if (pool.length < 6) pool = CHARACTERS;
  }
  const rounds = [];
  for (let i = 0; i < roundCount; i++) rounds.push(buildOneCharacterEgeRound(pool, false));
  return rounds;
}

/* --- РЕВЕРС --- */
function restartReverse() {
  const q = state.quiz;
  if (state.section === 'artasov') {
    q.reverse = !q.reverse;
    q.index = 0;
    q.answers = new Array(q.questions.length).fill(null);
    q.locked = new Array(q.questions.length).fill(false);
    q.peeked = new Array(q.questions.length).fill(false);
    state.referenceOpen = false;
    render();
    return;
  }
  if (state.section === 'characters' && q.mode === 'ege') {
    q.reverse = !q.reverse;
    q.answers = q.rounds.map(() => [null, null, null, null]);
    q.locked = q.rounds.map(() => false);
    q.index = 0;
    render();
    return;
  }
  if (state.section === 'characters' && q.mode === 'cards') {
    const questions = buildCharacterCardsQuiz(!q.reverse);
    state.quiz = {
      mode: 'cards', questions, index: 0,
      answers: new Array(questions.length).fill(null),
      reverse: !q.reverse, locked: new Array(questions.length).fill(false)
    };
    render();
    return;
  }
  const reverse = !q.reverse;
  const questions = buildDateQuiz(state.dateSource, state.period, reverse, state.dateLevel);
  state.quiz = {
    questions, index: 0,
    answers: new Array(questions.length).fill(null),
    reverse, locked: new Array(questions.length).fill(false)
  };
  render();
}

}

function checkOlimpiadnik() {
  const q = state.quiz;
  if (q.locked[q.index]) return;
  const input = document.getElementById('olimpInput');
  if (!input) return;
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  const item = q.questions[q.index];
  const correct = item.checkFn(value);
  q.answers[q.index] = { value, correct };
  q.locked[q.index] = true;
  render();
}
function nextOlimpiadnik() {
  const q = state.quiz;
  if (q.index < q.questions.length - 1) { q.index++; render(); }

function prevOlimpiadnik() {
  const q = state.quiz;
  if (q.index > 0) { q.index--; render(); }

function handleOlimpiadnikEnter() {
  const q = state.quiz;
  if (q.locked[q.index]) nextOlimpiadnik();
  else checkOlimpiadnik();
}

/* --- Персонажи: задание ЕГЭ --- */
function renderCharacterEgeQuiz() {
  const q = state.quiz;
  const round = q.rounds[q.index];
  const total = q.rounds.length;
  const reverse = q.reverse;
  const userAns = q.answers[q.index];
  const locked = q.locked[q.index];
  const progressPct = (q.index / total) * 100;

  let leftItems, rightItems, correctForLeft;
  if (!reverse) {
    leftItems = round.correct;
    rightItems = round.activities;
    correctForLeft = round.correctForPerson;
  } else {
    leftItems = round.reverseActivities;
    rightItems = round.reversePersons;
    correctForLeft = round.correctForActivity;
  }

  function numBtnClass(personIdx, num) {
    const chosen = userAns[personIdx];
    if (!locked) return chosen === num ? 'ege-num-btn selected' : 'ege-num-btn';
    if (correctForLeft[personIdx] === num) return 'ege-num-btn correct';
    if (chosen === num && chosen !== correctForLeft[personIdx]) return 'ege-num-btn wrong';
    return 'ege-num-btn';
  }

  const letters = ['А','Б','В','Г'];

  const rowsHTML = leftItems.map((it, i) => {
    const promptText = reverse ? it : `${it.name}`;
    return `
      <div class="ege-row">
        <div class="ege-letter">${letters[i]}</div>
        <div class="ege-prompt">${esc(promptText)}</div>
        <div class="ege-nums">
          ${[1,2,3,4,5,6].map(n => `
            <button class="${numBtnClass(i, n)}"
              ${locked ? 'disabled' : `onclick="pickEgeNum(${i}, ${n})"`}
              data-n="${n}">${n}</button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  const rightListHTML = rightItems.map((it, i) => {
    const text = reverse ? it.name : it;
    const meta = reverse ? `<div style="color:#6b6b6b;font-size:12px;font-family:sans-serif;margin-top:2px">${esc(it.period)}</div>` : '';
    return `
      <div class="opt-row">
        <div class="num-badge">${i + 1}</div>
        <div class="opt-text">${esc(text)}${meta}</div>
      </div>
    `;
  }).join('');

  const allFilled = userAns.every(v => v !== null);
  const correctCount = locked
    ? correctForLeft.reduce((acc, correctNum, i) => acc + (userAns[i] === correctNum ? 1 : 0), 0)
    : 0;

  const refBtnLabel = state.referenceOpen ? '📖 Убрать справочник' : '📖 Подглянуть в справочник';

  const inner = `
    <div class="quiz-top">
      <button class="arrow-btn" ${q.index === 0 ? 'disabled' : 'onclick="prevEgeRound()"'} title="Назад">←</button>
      <div class="progress-text">Задание ${q.index + 1} из ${total}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="mini-btn primary" onclick="toggleReference()">${refBtnLabel}</button>
        <button class="mini-btn" onclick="restartReverse()" title="Реверс">🔁 Реверс</button>
        <button class="mini-btn" onclick="quitQuiz()" title="В меню">✕</button>
      </div>
    </div>
    <div class="progress-bar"><div style="width:${progressPct}%"></div></div>
    <div class="question-box fade-in" style="padding: 12px 14px; text-align:left;">
      <div class="q-label" style="margin-bottom:6px;">
        ${reverse ? 'Соотнеси ДЕЙСТВИЯ (А–Г) с ДЕЯТЕЛЯМИ (1–6)' : 'Соотнеси ДЕЯТЕЛЕЙ (А–Г) с их ДЕЛАМИ (1–6)'}
      </div>
    </div>
    <div class="ege-table fade-in">${rowsHTML}</div>
    <div class="ege-options-box fade-in">${rightListHTML}</div>
    ${!locked ? `
      <div style="text-align:center; margin-top: 8px;">
        <button class="btn-primary" ${allFilled ? '' : 'disabled'} onclick="checkEgeRound()">Проверить</button>
      </div>
    ` : `
      <div class="feedback ${correctCount === 4 ? 'fb-correct' : 'fb-wrong'}" style="text-align:center;">
        ${correctCount === 4
          ? `✅ Всё верно! (4/4)`
          : `❌ Правильно: ${correctCount} из 4. Смотри подсветку.`}
      </div>
      <div style="text-align:center; margin-top: 14px;">
        <button class="btn-primary" onclick="nextEgeRound()">${q.index < total - 1 ? 'Дальше →' : 'Завершить'}</button>
      </div>
    `}
  `;

  if (state.referenceOpen) {
    app.innerHTML = `
      <div class="ref-layout open">
        <div class="ref-main">${inner}</div>
        <aside class="ref-side">
          <div class="ref-title">📖 Персоналии</div>
          <div class="ref-sub">Деятели по эпохам</div>
          <div>${characterReferenceTableHTML('')}</div>
        </aside>
      </div>
    `;
  } else {
    app.innerHTML = inner;
  }
}
function pickEgeNum(personIdx, num) {
  const q = state.quiz;
  if (q.locked[q.index]) return;
  const arr = q.answers[q.index];
  arr[personIdx] = arr[personIdx] === num ? null : num;
  renderCharacterEgeQuiz();
}
function checkEgeRound() {
  const q = state.quiz;
  if (q.locked[q.index]) return;
  const arr = q.answers[q.index];
  if (arr.some(v => v === null)) return;
  q.locked[q.index] = true;
  renderCharacterEgeQuiz();
}
function nextEgeRound() {
  const q = state.quiz;
  if (q.index < q.rounds.length - 1) { q.index++; render(); }
  else { state.screen = 'result'; render(); }
}
function prevEgeRound() {
  const q = state.quiz;
  if (q.index > 0) { q.index--; render(); }
}

/* --- ОТВЕТ (тесты, даты) --- */
let advanceTimer = null;
function answer(i) {
  const q = state.quiz;
  if (q.locked[q.index]) return;
  q.answers[q.index] = i;
  q.locked[q.index] = true;
  renderQuiz();
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => {
    if (q.index < q.questions.length - 1) { q.index++; render(); }
    else { state.screen = 'result'; render(); }
  }, 1200);
}
function checkTyped() {
  const q = state.quiz;
  if (q.locked[q.index]) return;
  const input = document.getElementById('dateInput');
  if (!input) return;
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  const correct = datesMatch(value, q.questions[q.index].item.date);
  q.answers[q.index] = { value, correct };
  q.locked[q.index] = true;
  renderQuiz();
}
function nextTyped() {
  const q = state.quiz;
  if (q.index < q.questions.length - 1) { q.index++; render(); }
  else { state.screen = 'result'; render(); }
}
function handleTypedEnter() {
  const q = state.quiz;
  if (q.locked[q.index]) nextTyped();
  else checkTyped();
}
function prevQuestion() {
  const q = state.quiz;
  if (q.index > 0) { clearTimeout(advanceTimer); q.index--; render(); }
}
function quitQuiz() {
  clearTimeout(advanceTimer);
  state.quiz = null;
  state.referenceOpen = false;
  if (state.section === 'artasov' || state.section === 'olimpiadnik' || state.section === 'culture') {
    state.screen = 'culture';
  } else if (state.section === 'characters') {
    if (state.characterMode === 'ege' && state.characterEgeLevel === 'hard') state.screen = 'characterEgePeriods';
    else if (state.characterMode === 'ege') state.screen = 'characterEgeLevels';
    else state.screen = 'characters';
  } else {
    state.screen = 'datePeriods';
  }
  render();
}

/* --- РЕЗУЛЬТАТ --- */
function verdict(pct) {
  if (pct === 100) return { emoji:'🏆', text:'Идеально! Ты — живая энциклопедия. Нестор-летописец записал бы тебя в свои хроники.' };
  if (pct >= 85)  return { emoji:'🎯', text:'Блестяще! ЕГЭ уже нервно листает учебник и просит пощады.' };
  if (pct >= 70)  return { emoji:'👍', text:'Хороший результат! Ещё немного — и ты станешь грозой всех историков.' };
  if (pct >= 55)  return { emoji:'🤔', text:'Средне. Как Смутное время: не худшее, но и не лучшее. Есть куда расти.' };
  if (pct >= 35)  return { emoji:'😅', text:'Так себе. Похоже, историю ты учил по мемам и пересказам одноклассника.' };
  if (pct >= 15)  return { emoji:'🫠', text:'Мда… Князь Игорь тоже сначала неудачно сходил в поход. Но он исправился — и ты сможешь.' };
  return { emoji:'💀', text:'Ты явно был занят чем-то более важным. Например, ничем. Начни заново — Рюрик тоже не сразу всё построил.' };
}

function renderResult() {
  const q = state.quiz;
  const v = verdict;
  let correct, total, pct, vv, scoreDisplay, totalDisplay;

  if (state.section === 'characters' && q.mode === 'ege') {
    total = q.rounds.length;
    correct = 0;
    q.rounds.forEach((round, ri) => {
      const ans = q.answers[ri];
      const correctArr = q.reverse ? round.correctForActivity : round.correctForPerson;
      let ok = true;
      for (let i = 0; i < 4; i++) if (ans[i] !== correctArr[i]) { ok = false; break; }
      if (ok) correct++;
    });
    pct = Math.round((correct / total) * 100);
    vv = v(pct);
    scoreDisplay = correct;
    totalDisplay = total;
  } else if (state.section === 'artasov') {
    total = q.questions.length;
    let score = 0;
    q.questions.forEach((it, i) => {
      if (q.answers[i] === it.correctIndex) {
        score += q.peeked[i] ? 0.25 : 1;
      }
    });
    correct = score;
    pct = Math.round((score / total) * 100);
    vv = v(pct);
    scoreDisplay = Number.isInteger(score) ? score : score.toFixed(2);
    totalDisplay = total;
  } else if (state.section === 'olimpiadnik') {
    total = q.questions.length;
    correct = q.questions.reduce((acc, it, i) => {
      const a = q.answers[i];
      return acc + (a && a.correct ? 1 : 0);
    }, 0);
    pct = Math.round((correct / total) * 100);
    vv = v(pct);
    scoreDisplay = correct;
    totalDisplay = total;
  } else {
    total = q.questions.length;
    const isTyping = state.section === 'dates' && state.dateLevel === 'hard';
    correct = q.questions.reduce((acc, it, i) => {
      const a = q.answers[i];
      if (isTyping) return acc + (a && a.correct ? 1 : 0);
      return acc + (a === it.correctIndex ? 1 : 0);
    }, 0);
    pct = Math.round((correct / total) * 100);
    vv = v(pct);
    scoreDisplay = correct;
    totalDisplay = total;
  }

  const isTyping = state.section === 'dates' && state.dateLevel === 'hard';
  const noReverse = isTyping || state.section === 'olimpiadnik';

  app.innerHTML = `
    ${header()}
    <div class="result fade-in">
      <div class="emoji">${vv.emoji}</div>
      <div class="score">${scoreDisplay} <span>/ ${totalDisplay}</span></div>
      <div class="q-desc" style="margin-bottom:10px;">${pct}% верных ответов</div>
      <div class="verdict">${vv.text}</div>
      <div class="result-actions">
        <button class="btn-primary" onclick="repeatQuiz()">Пройти заново</button>
        ${!noReverse ? `<button class="btn-ghost" onclick="restartReverse()">🔁 В режиме реверса</button>` : ''}
        <button class="btn-ghost" onclick="quitQuiz()">В меню</button>
      </div>
    </div>
  `;
}

function repeatQuiz() {
  if (state.section === 'dates') startDateQuiz(state.period);
  else if (state.section === 'artasov') startArtasov();
  else if (state.section === 'olimpiadnik') startOlimpiadnik();
  else if (state.section === 'characters') {
    if (state.characterMode === 'ege') startCharacterEge(state.period);
    else startCharacterCards();
  }
}

/* --- Глобальный Enter --- */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (state.screen !== 'quiz') return;
  const q = state.quiz;
  if (!q) return;
  if (state.section === 'dates' && state.dateLevel === 'hard' && q.locked[q.index]) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag !== 'input') { e.preventDefault(); nextTyped(); }
  }
  if (state.section === 'olimpiadnik' && q.locked[q.index]) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag !== 'input') { e.preventDefault(); nextOlimpiadnik(); }
  }
});

render();
</script>
